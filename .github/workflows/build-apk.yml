name: Compiler et publier l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Reconstituer la signature (si les secrets existent)
        id: signature
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            {
              echo "storePassword=$KS_PASS"
              echo "keyPassword=$KEY_PASS"
              echo "keyAlias=$KS_ALIAS"
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            } > android/key.properties
            echo "signe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets de signature absents : APK signé avec la clé de debug, publication désactivée."
            echo "signe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compiler l'APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Renommer
        run: cp build/app/outputs/flutter-apk/app-release.apk frigo-malin.apk

      - name: Conserver l'APK comme artefact (secours)
        uses: actions/upload-artifact@v4
        with:
          name: frigo-malin-apk
          path: frigo-malin.apk
          retention-days: 14

      - name: Publier la Release « latest »
        if: steps.signature.outputs.signe == 'true'
        run: |
          MSG="$(git log -1 --pretty=%B)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest frigo-malin.apk \
            --title "Frigo Malin — build #${{ github.run_number }}" \
            --notes "$MSG" \
            --target "${{ github.sha }}" \
            --latest
