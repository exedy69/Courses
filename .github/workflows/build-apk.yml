name: Compiler et publier l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux par défaut ; l'écriture n'est accordée qu'au job qui publie.
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions épinglées sur un commit précis (l'étiquette est en commentaire).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Bibliothèque SQLite pour les tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test du script Google
        run: node apps_script/test_code_gs.js apps_script/Code.gs

      # Les secrets ne sont visibles que par cette étape.
      - name: Reconstituer la signature (si les secrets existent)
        id: signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            {
              echo "storePassword=$KS_PASS"
              echo "keyPassword=$KEY_PASS"
              echo "keyAlias=$KS_ALIAS"
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            } > android/key.properties
            echo "signe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets de signature absents : APK signé avec la clé de debug, publication désactivée."
            echo "signe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compiler l'APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Effacer la signature du disque
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Renommer
        run: cp build/app/outputs/flutter-apk/app-release.apk frigo-malin.apk

      - name: Conserver l'APK comme artefact (secours)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frigo-malin-apk
          path: frigo-malin.apk
          retention-days: 14

      # Publication uniquement depuis main : un build lancé à la main sur une autre
      # branche compile et teste, sans remplacer la Release.
      - name: Publier la Release « latest »
        if: steps.signature.outputs.signe == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: Frigo Malin — build #${{ github.run_number }}
        run: |
          MSG="$(git log -1 --pretty=%B)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest frigo-malin.apk \
            --title "$TITRE" \
            --notes "$MSG" \
            --target "$GITHUB_SHA" \
            --latest
